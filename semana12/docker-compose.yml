services:
  neo4j:
    image: neo4j
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=none
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_PLUGINS='["apoc","graph-data-science"]'
    volumes:
      - ./data:/data
      - ./import:/import
      - ./plugins:/plugins
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_import: