services:
  postgres1:
    image: postgres:16
    container_name: postgres1
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pass
      POSTGRES_DB: demo
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pg1_data:/var/lib/postgresql/data
      - ./postgres1.conf:/etc/postgresql/postgresql.conf:ro
      - ./init/pg1:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d demo"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres2:
    image: postgres:16
    container_name: postgres2
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pass
      POSTGRES_DB: demo
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pg2_data:/var/lib/postgresql/data
      - ./postgres2.conf:/etc/postgresql/postgresql.conf:ro
      - ./init/pg2:/docker-entrypoint-initdb.d
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d demo"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Orquestador que crea publicaciones/suscripciones cuando ambos estén sanos
  setup:
    image: postgres:16
    depends_on:
      postgres1:
        condition: service_healthy
      postgres2:
        condition: service_healthy
    command:
      - /bin/bash
      - -lc
      - |
        set -e
        echo "Creando publicaciones y suscripciones..."
        # Crear rol replicator en ambos
        if [ "$(PGPASSWORD=app_pass psql -h postgres1 -U app -d demo -Atqc "SELECT 1 FROM pg_roles WHERE rolname='replicator'")" != "1" ]; then
          PGPASSWORD=app_pass psql -h postgres1 -U app -d demo -c "CREATE ROLE replicator WITH LOGIN REPLICATION PASSWORD 'repl_pass'";
        fi
        if [ "$(PGPASSWORD=app_pass psql -h postgres2 -U app -d demo -Atqc "SELECT 1 FROM pg_roles WHERE rolname='replicator'")" != "1" ]; then
          PGPASSWORD=app_pass psql -h postgres2 -U app -d demo -c "CREATE ROLE replicator WITH LOGIN REPLICATION PASSWORD 'repl_pass'";
        fi

        # Permisos de replicación
        PGPASSWORD=app_pass psql -h postgres1 -U app -d demo -c "ALTER ROLE replicator WITH REPLICATION;"
        PGPASSWORD=app_pass psql -h postgres2 -U app -d demo -c "ALTER ROLE replicator WITH REPLICATION;"

        # Permisos de lectura para sincronización inicial (publisher → subscriber)
        PGPASSWORD=app_pass psql -h postgres1 -U app -d demo -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO replicator;"
        PGPASSWORD=app_pass psql -h postgres1 -U app -d demo -v ON_ERROR_STOP=1 -c "GRANT SELECT ON ALL TABLES IN SCHEMA public TO replicator;"
        PGPASSWORD=app_pass psql -h postgres1 -U app -d demo -v ON_ERROR_STOP=1 -c "GRANT SELECT ON ALL SEQUENCES IN SCHEMA public TO replicator;"
        PGPASSWORD=app_pass psql -h postgres1 -U app -d demo -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO replicator;"
        PGPASSWORD=app_pass psql -h postgres1 -U app -d demo -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON SEQUENCES TO replicator;"

        PGPASSWORD=app_pass psql -h postgres2 -U app -d demo -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO replicator;"
        PGPASSWORD=app_pass psql -h postgres2 -U app -d demo -v ON_ERROR_STOP=1 -c "GRANT SELECT ON ALL TABLES IN SCHEMA public TO replicator;"
        PGPASSWORD=app_pass psql -h postgres2 -U app -d demo -v ON_ERROR_STOP=1 -c "GRANT SELECT ON ALL SEQUENCES IN SCHEMA public TO replicator;"
        PGPASSWORD=app_pass psql -h postgres2 -U app -d demo -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO replicator;"
        PGPASSWORD=app_pass psql -h postgres2 -U app -d demo -v ON_ERROR_STOP=1 -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON SEQUENCES TO replicator;"

        # Publicaciones para todas las tablas del esquema public
        PGPASSWORD=app_pass psql -h postgres1 -U app -d demo -c "DROP PUBLICATION IF EXISTS pub_all;"
        PGPASSWORD=app_pass psql -h postgres1 -U app -d demo -c "CREATE PUBLICATION pub_all FOR ALL TABLES;"
        PGPASSWORD=app_pass psql -h postgres2 -U app -d demo -c "DROP PUBLICATION IF EXISTS pub_all;"
        PGPASSWORD=app_pass psql -h postgres2 -U app -d demo -c "CREATE PUBLICATION pub_all FOR ALL TABLES;"

        # Suscripciones cruzadas (bidireccionales) evitando loops
        PGPASSWORD=app_pass psql -h postgres1 -U app -d demo -c "DROP SUBSCRIPTION IF EXISTS sub_from_2;"
        PGPASSWORD=app_pass psql -h postgres1 -U app -d demo -c "
          CREATE SUBSCRIPTION sub_from_2
          CONNECTION 'host=postgres2 port=5432 user=replicator password=repl_pass dbname=demo'
          PUBLICATION pub_all
          WITH (create_slot = true, slot_name = 'slot_2_to_1', copy_data = true, origin = 'none');"

        PGPASSWORD=app_pass psql -h postgres2 -U app -d demo -c "DROP SUBSCRIPTION IF EXISTS sub_from_1;"
        PGPASSWORD=app_pass psql -h postgres2 -U app -d demo -c "
          CREATE SUBSCRIPTION sub_from_1
          CONNECTION 'host=postgres1 port=5432 user=replicator password=repl_pass dbname=demo'
          PUBLICATION pub_all
          WITH (create_slot = true, slot_name = 'slot_1_to_2', copy_data = true, origin = 'none');"

        echo "Listo. Activo-activo en marcha."

volumes:
  pg1_data:
  pg2_data: